name: Validate and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: road-to-level-10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: road-to-level-10/package-lock.json
      - run: npm ci
      - run: npm test && npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: road-to-level-10/dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
